name: build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Clean and recreate android
        run: rm -rf android

      - name: Fix pubspec name
        run: sed -i 's/bronze-prestige-gate/bronze_prestige_gate/g' pubspec.yaml || true

      - name: Recreate android folder
        run: flutter create --project-name bronze_prestige_gate --platforms=android .

      - name: Auto-fix all dart errors
        run: |
          find lib -name "*.dart" -exec sed -i 's/MainAxisAlignment\.between/MainAxisAlignment.spaceBetween/g' {} \;
          find lib -name "*.dart" -exec sed -i 's/network_stabilizer/bronze_prestige_gate/g' {} \;
          find lib -name "*.dart" -exec sed -i '/flutter_ton_ui/d' {} \;
          find lib -name "*.dart" -exec sed -i 's/.*FlutterTom2.*/ \/\/ FlutterTom2 removed for build/g' {} \;

      - name: Get packages
        run: flutter pub get

      - name: Build APK Debug
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bronze-prestige-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
