name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Fix name and Recreate FIRST
        run: |
          sed -i 's/bronze-prestige-gate/bronze_prestige_gate/g' pubspec.yaml || true
          rm -rf android
          flutter create --project-name bronze_prestige_gate --platforms=android .

      - name: Clean AFTER recreate - THIS FIXES IT
        run: |
          rm -f analysis_options.yaml
          rm -f test/widget_test.dart
          rm -f lib/wait.dart
          mkdir -p assets/audio
          touch assets/audio/pulse10hz.mp3
          sed -i '/flutter_ton_ui/d' pubspec.yaml || true
          sed -i '/flutter_tun_v2/d' pubspec.yaml || true
          grep -r "wait.dart" lib/ -l | xargs sed -i '/wait.dart/d' || true

      - name: Overwrite files
        run: |
          cat > lib/dashboard.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'dart:convert';
          import 'dart:async';
          import 'dart:isolate';
          import 'package:audioplayers/audioplayers.dart';
          import 'package:flutter_foreground_task/flutter_foreground_task.dart';
          class PremiumDashboardScreen extends StatefulWidget {
            final String paymentReference; final String serverIp;
            const PremiumDashboardScreen({super.key, required this.paymentReference, required this.serverIp});
            @override State<PremiumDashboardScreen> createState() => _PremiumDashboardScreenState();
          }
          class _PremiumDashboardScreenState extends State<PremiumDashboardScreen> {
            bool isEngineActive = false; String connectionStatus = "STANDBY ZONE"; String latencyMetrics = "--";
            final AudioPlayer _audioPlayer = AudioPlayer(); Timer? _heartbeatTimer;
            final Color obsidianBlack = const Color(0xFF030305); final Color gold24k = const Color(0xFFFFD700); final Color steelGray = const Color(0xFF1C1C24);
            @override void initState() { super.initState(); FlutterForegroundTask.init(androidNotificationOptions: AndroidNotificationOptions(channelId: 'gold_stabilizer_channel', channelName: 'Elite Gold Stabilizer', channelDescription: 'Optimizing', channelImportance: NotificationChannelImportance.LOW, priority: NotificationPriority.LOW), iosNotificationOptions: const IOSNotificationOptions(showNotification: true, playSound: false), foregroundTaskOptions: const ForegroundTaskOptions(isOnceEvent: false, autoRunOnBoot: true, allowWakeLock: true, allowWifiLock: true)); }
            Future<void> toggleOptimizationEngine(bool targetState) async {
              try { final verifyResponse = await http.get(Uri.parse('http://${widget.serverIp}:3000/api/auth/verify-license?reference=${widget.paymentReference}')).timeout(const Duration(seconds: 10)); final authData = json.decode(verifyResponse.body); if (authData['authorized'] != true) return; } catch (e) { return; }
              setState(() { isEngineActive = targetState; });
              if (isEngineActive) { setState(() { connectionStatus = "TUNNEL ACTIVE"; latencyMetrics = "14ms"; }); try { await _audioPlayer.setReleaseMode(ReleaseMode.loop); await _audioPlayer.setVolume(0.01); await _audioPlayer.play(AssetSource('audio/pulse10hz.mp3')); } catch (e) {} try { await FlutterForegroundTask.startService(notificationTitle: 'Elite Gold Active', notificationText: 'Optimizing...', callback: startCallback); } catch (e) {} _heartbeatTimer = Timer.periodic(const Duration(seconds: 3), (t) async { try { await http.get(Uri.parse('http://${widget.serverIp}:3000/')); } catch (e) {} }); } else { setState(() { connectionStatus = "STANDBY ZONE"; latencyMetrics = "--"; }); try { await _audioPlayer.stop(); } catch (e) {} await FlutterForegroundTask.stopService(); _heartbeatTimer?.cancel(); }
            }
            @override void dispose() { _heartbeatTimer?.cancel(); _audioPlayer.dispose(); super.dispose(); }
            @override Widget build(BuildContext context) { return WithForegroundTask(child: Scaffold(backgroundColor: obsidianBlack, appBar: AppBar(backgroundColor: steelGray, title: const Text("ELITE GOLD CONSOLE", style: TextStyle(color: Color(0xFFFFD700), fontWeight: FontWeight.bold, fontSize: 16)), centerTitle: true), body: Padding(padding: const EdgeInsets.all(20), child: Column(children: [Container(padding: const EdgeInsets.all(20), decoration: BoxDecoration(color: steelGray, borderRadius: BorderRadius.circular(12), border: Border.all(color: gold24k.withOpacity(0.5))), child: Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [Column(crossAxisAlignment: CrossAxisAlignment.start, children: [const Text("TIER: PREMIUM", style: TextStyle(color: Colors.white54, fontSize: 10)), Text(connectionStatus, style: TextStyle(color: isEngineActive ? Colors.greenAccent : gold24k, fontSize: 18, fontWeight: FontWeight.bold))]), Switch(value: isEngineActive, onChanged: toggleOptimizationEngine, activeColor: gold24k)])), const SizedBox(height: 30), Text(latencyMetrics, style: TextStyle(color: gold24k, fontWeight: FontWeight.bold, fontSize: 14))])))); }
          }
          @pragma('vm:entry-point') void startCallback() { FlutterForegroundTask.setTaskHandler(MyTaskHandler()); }
          class MyTaskHandler extends TaskHandler {
            @override Future<void> onStart(DateTime timestamp, SendPort? sendPort) async {}
            @override Future<void> onEvent(DateTime timestamp, SendPort? sendPort) async {}
            @override Future<void> onDestroy(DateTime timestamp, SendPort? sendPort) async {}
            @override void onButtonPressed(String id) {}
            @override void onNotificationPressed() {}
          }
          DART
          cat > lib/main.dart << 'MAIN'
          import 'package:flutter/material.dart';
          import 'dashboard.dart';
          void main() { runApp(const MaterialApp(home: PremiumDashboardScreen(paymentReference: "test", serverIp: "127.0.0.1"))); }
          MAIN

      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-debug.apk
