name: Build App
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
      - run: rm -rf android
      - run: sed -i 's/bronze-prestige-gate/bronze_prestige_gate/g' pubspec.yaml || true
      - run: flutter create --project-name bronze_prestige_gate --platforms=android .
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: network-stabilizer-package
          path: build/app/outputs/flutter-apk/*.apk
