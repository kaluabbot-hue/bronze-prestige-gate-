name: Build App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Application Layout
        run: flutter build web --release

      - name: Package Download Link
        uses: actions/upload-artifact@v4
        with:
          name: network-stabilizer-package
          path: build/web/
